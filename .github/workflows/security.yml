name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so advisories that land after a merge still get caught

permissions:
  contents: read

jobs:
  # Audit the GitHub Actions workflows themselves for injection, credential persistence,
  # unpinned actions, and over-broad permissions.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --extra dev --frozen
      - name: Audit workflows (zizmor)
        # The token enables zizmor's online checks (impostor commits, known-vulnerable
        # actions), not just the offline audit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run zizmor .github/workflows

  # Scan the whole history for committed secrets. Lab-only dev credentials are allowlisted
  # in .gitleaks.toml. Runs the gitleaks binary directly (pinned + checksum-verified) with a
  # full-history `detect`, which is deterministic and does not choke on a repo's root commit
  # the way gitleaks-action's incremental commit-range diff does on an initial push.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          sha256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
